<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuraCalc — Modern Glassmorphic Calculator</title>
  <meta name="description" content="A sleek, modern glassmorphic web calculator with standard and scientific modes, calculation history, haptic audio feedback, and multiple dynamic themes.">
  <meta name="keywords" content="calculator, web calculator, scientific calculator, glassmorphic UI, modern calculator">
  <meta name="author" content="Antigravity">
  
  <!-- Google Fonts: Outfit & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body data-theme="nebula">
  <!-- Ambient background glow elements -->
  <div class="ambient-glow glow-1" aria-hidden="true"></div>
  <div class="ambient-glow glow-2" aria-hidden="true"></div>
  <div class="ambient-glow glow-3" aria-hidden="true"></div>

  <main class="calculator-wrapper">
    <!-- Top Bar Controls -->
    <header class="app-header">
      <div class="app-branding">
        <div class="app-logo-badge">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="3"></rect>
            <line x1="8" y1="6" x2="16" y2="6"></line>
            <line x1="16" y1="14" x2="16" y2="18"></line>
            <path d="M16 10h.01"></path>
            <path d="M12 10h.01"></path>
            <path d="M8 10h.01"></path>
            <path d="M12 14h.01"></path>
            <path d="M8 14h.01"></path>
            <path d="M12 18h.01"></path>
            <path d="M8 18h.01"></path>
          </svg>
        </div>
        <h1 class="app-title">AuraCalc</h1>
      </div>

      <div class="top-controls">
        <!-- Sound toggle -->
        <button id="soundToggleBtn" class="icon-btn" title="Toggle Sound Feedback (Mute/Unmute)" aria-label="Toggle Sound">
          <svg class="sound-on-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
          </svg>
          <svg class="sound-off-icon hidden" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
            <line x1="23" y1="9" x2="17" y2="15"></line>
            <line x1="17" y1="9" x2="23" y2="15"></line>
          </svg>
        </button>

        <!-- Theme Picker Button -->
        <div class="theme-selector-wrapper">
          <button id="themeMenuBtn" class="icon-btn" title="Change Theme" aria-label="Change Theme">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="5"></circle>
              <path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"></path>
            </svg>
          </button>
          <div id="themeDropdown" class="theme-dropdown hidden" role="menu">
            <button class="theme-option active" data-theme-value="nebula" role="menuitem">
              <span class="theme-dot nebula-dot"></span> Nebula Glow
            </button>
            <button class="theme-option" data-theme-value="cyber" role="menuitem">
              <span class="theme-dot cyber-dot"></span> Cyber Mint
            </button>
            <button class="theme-option" data-theme-value="sunset" role="menuitem">
              <span class="theme-dot sunset-dot"></span> Sunset Luxe
            </button>
            <button class="theme-option" data-theme-value="minimal-light" role="menuitem">
              <span class="theme-dot light-dot"></span> Frosted Light
            </button>
          </div>
        </div>

        <!-- History Toggle Button -->
        <button id="historyToggleBtn" class="icon-btn" title="Toggle Calculation History" aria-label="Toggle History">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
        </button>

        <!-- Scientific Mode Toggle Button -->
        <button id="scientificToggleBtn" class="mode-pill-btn" title="Toggle Scientific Operations">
          <span class="pill-label">ADV</span>
        </button>
      </div>
    </header>

    <!-- Main App Container (Calculator + History Panel) -->
    <div class="calculator-card" id="calculatorCard">
      <!-- Calculator Body -->
      <section class="calculator-body" aria-label="Calculator Interface">
        <!-- Display Screen -->
        <div class="display-container" id="displayContainer">
          <div class="display-status-bar">
            <div class="status-left">
              <span id="angleModeBadge" class="status-badge clickable" title="Click to toggle DEG / RAD">DEG</span>
              <span id="memoryBadge" class="status-badge memory-badge hidden">M</span>
            </div>
            <div class="status-right">
              <button id="copyResultBtn" class="copy-btn" title="Copy current result to clipboard">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                </svg>
                <span>Copy</span>
              </button>
            </div>
          </div>

          <!-- Expression history line -->
          <div class="expression-line" id="expressionDisplay" aria-live="polite"></div>

          <!-- Main Input / Result value display -->
          <div class="result-line" id="resultDisplay" aria-live="assertive">0</div>
        </div>

        <!-- Scientific Mode Expandable Tray -->
        <div class="scientific-tray collapsed" id="scientificTray" aria-hidden="true">
          <div class="keypad-grid scientific-grid">
            <button type="button" class="calc-btn btn-sci" data-action="deg-rad" id="btnDegRad" title="Angle Mode">deg/rad</button>
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="sin" id="btnSin" title="Sine">sin</button>
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="cos" id="btnCos" title="Cosine">cos</button>
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="tan" id="btnTan" title="Tangent">tan</button>
            
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="ln" id="btnLn" title="Natural Logarithm">ln</button>
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="log" id="btnLog" title="Base 10 Logarithm">log</button>
            <button type="button" class="calc-btn btn-sci" data-action="insert" data-value="^" id="btnPower" title="Power (x^y)">x^y</button>
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="sqrt" id="btnSqrt" title="Square Root">√</button>

            <button type="button" class="calc-btn btn-sci" data-action="insert" data-value="π" id="btnPi" title="Pi Constant">π</button>
            <button type="button" class="calc-btn btn-sci" data-action="insert" data-value="e" id="btnEuler" title="Euler Constant">e</button>
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="square" id="btnSquare" title="Square (x²)">x²</button>
            <button type="button" class="calc-btn btn-sci" data-action="sci-func" data-value="fact" id="btnFact" title="Factorial (n!)">n!</button>
          </div>
        </div>

        <!-- Memory Operations Bar -->
        <div class="memory-bar">
          <button type="button" class="calc-btn btn-mem" data-action="mem-clear" id="btnMemClear" title="Memory Clear">MC</button>
          <button type="button" class="calc-btn btn-mem" data-action="mem-recall" id="btnMemRecall" title="Memory Recall">MR</button>
          <button type="button" class="calc-btn btn-mem" data-action="mem-add" id="btnMemAdd" title="Memory Add">M+</button>
          <button type="button" class="calc-btn btn-mem" data-action="mem-sub" id="btnMemSub" title="Memory Subtract">M-</button>
          <button type="button" class="calc-btn btn-mem" data-action="insert" data-value="(" id="btnParenOpen" title="Open Parenthesis">(</button>
          <button type="button" class="calc-btn btn-mem" data-action="insert" data-value=")" id="btnParenClose" title="Close Parenthesis">)</button>
        </div>

        <!-- Primary Standard Keypad -->
        <div class="keypad-grid standard-grid">
          <!-- Row 1 -->
          <button type="button" class="calc-btn btn-danger" data-action="all-clear" id="btnAllClear">AC</button>
          <button type="button" class="calc-btn btn-secondary" data-action="delete" id="btnDelete" title="Backspace">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"></path>
              <line x1="18" y1="9" x2="12" y2="15"></line>
              <line x1="12" y1="9" x2="18" y2="15"></line>
            </svg>
          </button>
          <button type="button" class="calc-btn btn-secondary" data-action="percent" id="btnPercent" title="Percentage">%</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="÷" id="btnDivide">÷</button>

          <!-- Row 2 -->
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="7" id="btn7">7</button>
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="8" id="btn8">8</button>
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="9" id="btn9">9</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="×" id="btnMultiply">×</button>

          <!-- Row 3 -->
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="4" id="btn4">4</button>
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="5" id="btn5">5</button>
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="6" id="btn6">6</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="-" id="btnSubtract">−</button>

          <!-- Row 4 -->
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="1" id="btn1">1</button>
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="2" id="btn2">2</button>
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="3" id="btn3">3</button>
          <button type="button" class="calc-btn btn-operator" data-action="operator" data-value="+" id="btnAdd">+</button>

          <!-- Row 5 -->
          <button type="button" class="calc-btn btn-secondary" data-action="negate" id="btnNegate" title="Positive/Negative toggle">±</button>
          <button type="button" class="calc-btn btn-num" data-action="number" data-value="0" id="btn0">0</button>
          <button type="button" class="calc-btn btn-num" data-action="decimal" data-value="." id="btnDecimal">.</button>
          <button type="button" class="calc-btn btn-equals" data-action="equals" id="btnEquals">=</button>
        </div>
      </section>

      <!-- History Panel (Collapsible Drawer / Split View) -->
      <aside class="history-panel hidden" id="historyPanel" aria-label="Calculation History">
        <div class="history-header">
          <div class="history-title">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <h2>History</h2>
          </div>
          <button id="clearHistoryBtn" class="clear-history-btn" title="Clear all history">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <polyline points="3 6 5 6 21 6"></polyline>
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
            </svg>
            Clear
          </button>
        </div>

        <div class="history-list" id="historyList">
          <div class="history-empty" id="historyEmpty">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
              <line x1="8" y1="21" x2="16" y2="21"></line>
              <line x1="12" y1="17" x2="12" y2="21"></line>
            </svg>
            <p>No calculations yet</p>
            <span>Your past equations will appear here</span>
          </div>
        </div>
      </aside>
    </div>

    <!-- Keyboard Shortcuts Guide & Footer -->
    <footer class="app-footer">
      <div class="keyboard-hints">
        <span class="hint-tag"><kbd>Enter</kbd> =</span>
        <span class="hint-tag"><kbd>Esc</kbd> AC</span>
        <span class="hint-tag"><kbd>⌫</kbd> Del</span>
        <span class="hint-tag"><kbd>H</kbd> History</span>
        <span class="hint-tag"><kbd>A</kbd> Scientific</span>
      </div>
      <div class="footer-credit">
        Crafted with precision & modern aesthetics
      </div>
    </footer>
  </main>

  <!-- Toast Notification -->
  <div id="toastNotification" class="toast-notification hidden" role="status" aria-live="polite">
    <span id="toastMessage">Result copied to clipboard</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
